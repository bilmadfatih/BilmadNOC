<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bilmad NOC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fb; }
    .noc-sidebar { min-height: 100vh; background: #0f172a; }
    .noc-sidebar a { color: #cbd5e1; text-decoration: none; display: block; padding: .75rem 1rem; border-radius: .75rem; }
    .noc-sidebar a:hover { background: #1e293b; color: #fff; }
    .metric-card { border: 0; border-radius: 1rem; box-shadow: 0 10px 25px rgba(15,23,42,.06); }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <aside class="col-md-2 noc-sidebar p-3">
      <h5 class="text-white fw-bold mb-4">Bilmad NOC</h5>
      <a href="/">Mission Control</a>
      <a href="/admin/">Admin</a>
    </aside>
    <main class="col-md-10">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
